{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Вход - Колледж КТ МТУСИ</title>
    <link rel="stylesheet" href="{% static 'style/style.css' %}">
    <link rel="stylesheet" href="{% static 'style/auth.css' %}">
</head>
<body class="auth-page">
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <h2>Вход в систему</h2>
                <p class="auth-subtitle">Добро пожаловать в систему расписания колледжа</p>
            </div>
            <form method="post" class="auth-form">
                {% csrf_token %}
                {% if form.errors %}
                    <div class="auth-error">
                        <p>Пожалуйста, проверьте правильность введенных данных</p>
                    </div>
                {% endif %}
                <div class="form-group">
                    <label for="id_username">Имя пользователя</label>
                    {{ form.username }}
                </div>
                <div class="form-group">
                    <label for="id_password">Пароль</label>
                    {{ form.password }}
                </div>
                <button type="submit" class="auth-button">Войти</button>
            </form>
            <div class="auth-footer">
                <p>Нет аккаунта? <a href="{% url 'raspisanie:signup' %}" class="auth-link">Зарегистрироваться</a></p>
            </div>
        </div>
    </div>
</body>
</html>
